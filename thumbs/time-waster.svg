<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#1f5c5a"/>

  <!-- The sand, all sized to sit inside the glass: the walls run from
       (36,30) to the neck at (50,50), so nothing crosses them. -->
  <g fill="#f1ede4">
    <!-- the heap and the stream are one shape, so the sand really does run
         from the neck into the pile rather than stopping short of it -->
    <path d="M38.5 75.5h23L50.6 62V49h-1.2v13Z"/>
    <path d="M47.6 43h4.8L50 47.5Z"/>         <!-- the last of it, about to go -->
  </g>

  <!-- the glass -->
  <g fill="none" stroke="#f1ede4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 22h36"/>
    <path d="M32 78h36"/>
    <path d="M36 22v8l14 20 14-20v-8"/>
    <path d="M36 78v-8l14-20 14 20v8"/>
  </g>
</svg>
