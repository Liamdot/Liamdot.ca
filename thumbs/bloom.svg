<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#16161a"/>

  <!-- the chain, caught part way: rings opening one inside the next -->
  <g fill="none" stroke-width="1.6">
    <circle cx="38" cy="58" r="26" stroke="#7ee08a" opacity="0.85"/>
    <circle cx="38" cy="58" r="26" fill="#7ee08a" opacity="0.1" stroke="none"/>
    <circle cx="64" cy="40" r="17" stroke="#7ee08a" opacity="0.7"/>
    <circle cx="64" cy="40" r="17" fill="#7ee08a" opacity="0.08" stroke="none"/>
    <circle cx="74" cy="66" r="10" stroke="#f2c94c" opacity="0.8"/>
    <circle cx="74" cy="66" r="10" fill="#f2c94c" opacity="0.1" stroke="none"/>
    <circle cx="26" cy="28" r="7" stroke="#6fc3df" opacity="0.65"/>
  </g>

  <!-- dots waiting to be caught, and one gold one that has been -->
  <g>
    <circle cx="16" cy="76" r="4" fill="#7ee08a"/>
    <circle cx="50" cy="86" r="4" fill="#7ee08a"/>
    <circle cx="86" cy="24" r="4" fill="#7ee08a"/>
    <circle cx="60" cy="14" r="4" fill="#6fc3df"/>
    <circle cx="90" cy="88" r="4" fill="#d98ae0"/>
    <circle cx="74" cy="66" r="4.5" fill="#f2c94c"/>
  </g>
</svg>
