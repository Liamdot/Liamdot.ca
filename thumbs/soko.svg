<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#e9a23b"/>

  <!-- a strip of warehouse floor between two runs of wall -->
  <rect x="0" y="30" width="100" height="44" fill="#f3e3c3"/>
  <g fill="#5b5049">
    <rect x="0" y="22" width="100" height="8"/>
    <rect x="0" y="74" width="100" height="8"/>
  </g>
  <g stroke="#4a413b" stroke-width="1.4">
    <line x1="20" y1="22" x2="20" y2="30"/><line x1="45" y1="22" x2="45" y2="30"/>
    <line x1="70" y1="22" x2="70" y2="30"/><line x1="95" y1="22" x2="95" y2="30"/>
    <line x1="8" y1="74" x2="8" y2="82"/><line x1="33" y1="74" x2="33" y2="82"/>
    <line x1="58" y1="74" x2="58" y2="82"/><line x1="83" y1="74" x2="83" y2="82"/>
  </g>

  <!-- the goal it's heading for -->
  <circle cx="82" cy="52" r="10" fill="none" stroke="#c8553d" stroke-width="3"/>
  <circle cx="82" cy="52" r="3.5" fill="#c8553d"/>

  <!-- the box, mid-push -->
  <rect x="44" y="38" width="28" height="28" rx="2.5" fill="#c98a43" stroke="#8a5a28" stroke-width="3"/>
  <path d="M46.5 40.5 L69.5 63.5 M69.5 40.5 L46.5 63.5" stroke="#8a5a28" stroke-width="2.4"/>

  <!-- and whoever is doing the pushing -->
  <circle cx="27" cy="53" r="12" fill="#2f6f9f" stroke="#24577d" stroke-width="2"/>
  <circle cx="24" cy="51" r="2.6" fill="#fbf8f1"/><circle cx="31" cy="51" r="2.6" fill="#fbf8f1"/>
  <circle cx="25" cy="51.5" r="1.3" fill="#16161a"/><circle cx="32" cy="51.5" r="1.3" fill="#16161a"/>
</svg>
