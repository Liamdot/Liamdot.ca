<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#e9a23b"/>

  <!-- a row of floor with a wall all the way round it: five squares by three -->
  <rect x="0" y="20" width="100" height="60" fill="#5b5049"/>
  <g stroke="#4a413b" stroke-width="1.2">
    <!-- brick courses, top and bottom -->
    <line x1="0" y1="30" x2="100" y2="30"/>
    <line x1="0" y1="70" x2="100" y2="70"/>
    <line x1="0" y1="50" x2="20" y2="50"/>
    <line x1="80" y1="50" x2="100" y2="50"/>
    <!-- joints, staggered from one course to the next -->
    <line x1="10" y1="20" x2="10" y2="30"/><line x1="30" y1="20" x2="30" y2="30"/>
    <line x1="50" y1="20" x2="50" y2="30"/><line x1="70" y1="20" x2="70" y2="30"/>
    <line x1="90" y1="20" x2="90" y2="30"/>
    <line x1="20" y1="30" x2="20" y2="40"/><line x1="40" y1="30" x2="40" y2="40"/>
    <line x1="60" y1="30" x2="60" y2="40"/><line x1="80" y1="30" x2="80" y2="40"/>
    <line x1="10" y1="40" x2="10" y2="50"/><line x1="90" y1="40" x2="90" y2="50"/>
    <line x1="10" y1="60" x2="10" y2="70"/><line x1="90" y1="60" x2="90" y2="70"/>
    <line x1="20" y1="70" x2="20" y2="80"/><line x1="40" y1="70" x2="40" y2="80"/>
    <line x1="60" y1="70" x2="60" y2="80"/><line x1="80" y1="70" x2="80" y2="80"/>
  </g>
  <rect x="20" y="40" width="60" height="20" fill="#e9e2d3"/>
  <g stroke="#ddd4c2" stroke-width="1">
    <line x1="40" y1="40" x2="40" y2="60"/>
    <line x1="60" y1="40" x2="60" y2="60"/>
  </g>

  <!-- the player -->
  <circle cx="30" cy="50.5" r="7" fill="#2f6f9f" stroke="#24577d" stroke-width="1.2"/>
  <circle cx="27.6" cy="49.5" r="1.6" fill="#fbf8f1"/><circle cx="32.4" cy="49.5" r="1.6" fill="#fbf8f1"/>
  <circle cx="27.8" cy="49.8" r="0.8" fill="#16161a"/><circle cx="32.6" cy="49.8" r="0.8" fill="#16161a"/>

  <!-- the box, its cross running corner to corner -->
  <defs><clipPath id="crate"><rect x="42" y="42" width="16" height="16" rx="1.2"/></clipPath></defs>
  <rect x="42" y="42" width="16" height="16" rx="1.2" fill="#c98a43"/>
  <path d="M42 42 L58 58 M58 42 L42 58" stroke="#9b6530" stroke-width="1.3" clip-path="url(#crate)"/>
  <rect x="42" y="42" width="16" height="16" rx="1.2" fill="none" stroke="#9b6530" stroke-width="1.6"/>

  <!-- and where it's going -->
  <circle cx="70" cy="50" r="5.3" fill="none" stroke="#c8553d" stroke-width="1.4"/>
  <circle cx="70" cy="50" r="1.9" fill="#c8553d"/>
</svg>
