# nginx config for serving the site on the Raspberry Pi.
# Installed to /etc/nginx/sites-available/liamdot by setup-pi.sh.
#
# It only listens on the Pi itself (127.0.0.1). The public gets to it through
# the Cloudflare Tunnel, which forwards liamdot.ca to http://localhost:8080.

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/liamdot;
    index index.html;
    server_tokens off;

    # Hide dotfiles and folders (.git, .gitignore, .claude).
    location ~ /\. {
        deny all;
    }

    # Hide files that are only for running the site, not for visitors.
    location ~ ^/(deploy/|serve\.py) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;

        # Browsers re-check files every 5 minutes, so pushed changes show up quickly.
        add_header Cache-Control "public, max-age=300";
    }
}
