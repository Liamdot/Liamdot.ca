<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#1d1d1f"/>

  <!-- faint connections: every neuron to every neuron in the next layer -->
  <g stroke="#f1ede4" stroke-width="0.6" opacity="0.12">
    <path d="M20 22 L50 30 M20 22 L50 45 M20 22 L50 60 M20 22 L50 75
             M20 36 L50 30 M20 36 L50 45 M20 36 L50 60 M20 36 L50 75
             M20 50 L50 30 M20 50 L50 45 M20 50 L50 60 M20 50 L50 75
             M20 64 L50 30 M20 64 L50 45 M20 64 L50 60 M20 64 L50 75
             M20 78 L50 30 M20 78 L50 45 M20 78 L50 60 M20 78 L50 75
             M50 30 L80 35 M50 30 L80 50 M50 30 L80 65
             M50 45 L80 35 M50 45 L80 50 M50 45 L80 65
             M50 60 L80 35 M50 60 L80 50 M50 60 L80 65
             M50 75 L80 35 M50 75 L80 50 M50 75 L80 65"/>
  </g>

  <!-- the connections doing the work: green pushes up, red pushes down -->
  <g stroke-linecap="round">
    <line x1="20" y1="22" x2="50" y2="45" stroke="#7ee08a" stroke-width="1.8" opacity="0.9"/>
    <line x1="20" y1="50" x2="50" y2="45" stroke="#7ee08a" stroke-width="1.4" opacity="0.7"/>
    <line x1="20" y1="50" x2="50" y2="60" stroke="#7ee08a" stroke-width="1.2" opacity="0.6"/>
    <line x1="20" y1="64" x2="50" y2="30" stroke="#ff6b5e" stroke-width="1.2" opacity="0.6"/>
    <line x1="20" y1="78" x2="50" y2="60" stroke="#7ee08a" stroke-width="1.6" opacity="0.8"/>
    <line x1="50" y1="45" x2="80" y2="50" stroke="#7ee08a" stroke-width="2.2" opacity="1"/>
    <line x1="50" y1="60" x2="80" y2="50" stroke="#7ee08a" stroke-width="1.6" opacity="0.8"/>
    <line x1="50" y1="45" x2="80" y2="35" stroke="#ff6b5e" stroke-width="1.2" opacity="0.6"/>
    <line x1="50" y1="60" x2="80" y2="65" stroke="#ff6b5e" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- neurons: brighter = more active -->
  <g stroke="#55555c" stroke-width="1">
    <circle cx="20" cy="22" r="5" fill="#7ee08a"/>
    <circle cx="20" cy="36" r="5" fill="#2c2c30"/>
    <circle cx="20" cy="50" r="5" fill="#6bbd78"/>
    <circle cx="20" cy="64" r="5" fill="#3d5c43"/>
    <circle cx="20" cy="78" r="5" fill="#7ee08a"/>

    <circle cx="50" cy="30" r="5.5" fill="#2c2c30"/>
    <circle cx="50" cy="45" r="5.5" fill="#7ee08a"/>
    <circle cx="50" cy="60" r="5.5" fill="#6bbd78"/>
    <circle cx="50" cy="75" r="5.5" fill="#2c2c30"/>

    <circle cx="80" cy="35" r="6" fill="#2c2c30"/>
    <circle cx="80" cy="50" r="6" fill="#ffe27a" stroke="#ffe27a" stroke-width="2"/>
    <circle cx="80" cy="65" r="6" fill="#2c2c30"/>
  </g>
</svg>
