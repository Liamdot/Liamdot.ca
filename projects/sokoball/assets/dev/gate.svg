<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- developer art: a gate, shut - as solid as a wall until every plate is
       weighed down. Same colour as the plates, so they read as a pair. -->
  <rect x="3" y="3" width="58" height="58" rx="4" fill="#2c5560"/>
  <g fill="#7fb0bd">
    <rect x="9" y="6" width="6" height="52" rx="2"/>
    <rect x="22" y="6" width="6" height="52" rx="2"/>
    <rect x="36" y="6" width="6" height="52" rx="2"/>
    <rect x="49" y="6" width="6" height="52" rx="2"/>
    <rect x="6" y="18" width="52" height="5" rx="2"/>
    <rect x="6" y="41" width="52" height="5" rx="2"/>
  </g>
</svg>
