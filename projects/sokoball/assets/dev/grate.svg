<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- developer art: a grate - just bars over the drop, no frame. Anything
       rolling gets across; anything that stops on it falls through, and the
       two halves swing down into the hole. Drawn on top of the floor. -->
  <rect x="4" y="4" width="56" height="56" rx="3" fill="#1a1613"/>
  <g fill="#9a8f84">
    <rect x="9" y="4" width="4.5" height="56" rx="1.5"/>
    <rect x="21" y="4" width="4.5" height="56" rx="1.5"/>
    <rect x="38.5" y="4" width="4.5" height="56" rx="1.5"/>
    <rect x="50.5" y="4" width="4.5" height="56" rx="1.5"/>
  </g>
</svg>
