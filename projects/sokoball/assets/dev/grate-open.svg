<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- developer art: a grate while it's open - the same frame as grate.svg,
       with the drop showing through where the bars were. The barred part of
       the grate swings down into this on hinges at its sides. -->
  <rect x="4" y="4" width="56" height="56" rx="3" fill="#050404"/>
  <g fill="#9a8f84">
    <rect x="4" y="4" width="56" height="5" rx="2"/>
    <rect x="4" y="55" width="56" height="5" rx="2"/>
    <rect x="4" y="4" width="5" height="56" rx="2"/>
    <rect x="55" y="4" width="5" height="56" rx="2"/>
  </g>
</svg>
